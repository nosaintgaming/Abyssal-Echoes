<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="abyssBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140714" />
      <stop offset="70%" stop-color="#070710" />
      <stop offset="100%" stop-color="#020205" />
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b3b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#abyssBg)" rx="104" />
  
  <!-- Outer Sonar Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ef4444" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.2" />

  <!-- Hydrostatic Crosshairs -->
  <line x1="256" y1="20" x2="256" y2="70" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6" />
  <line x1="256" y1="442" x2="256" y2="492" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6" />
  <line x1="20" y1="256" x2="70" y2="256" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6" />
  <line x1="442" y1="256" x2="492" y2="256" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6" />

  <!-- Diving Helmet / Bulkhead Core Ring -->
  <circle cx="256" cy="256" r="115" fill="url(#metalRing)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.8" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="95" fill="#04060d" stroke="#ef4444" stroke-width="4" stroke-opacity="0.7" />

  <!-- Center Omega Symbol & Glowing Predatory Optic -->
  <circle cx="256" cy="256" r="60" fill="url(#eyeGlow)" opacity="0.85" />
  
  <!-- The Omega Glyph Ω -->
  <path d="M 195 315 L 222 315 C 220 295 210 270 216 240 C 224 200 256 180 256 180 C 256 180 288 200 296 240 C 302 270 292 295 290 315 L 317 315 C 322 315 326 319 326 324 L 326 328 C 326 333 322 337 317 337 L 272 337 C 267 337 263 333 263 328 L 263 318 C 263 300 278 280 278 250 C 278 230 266 215 256 215 C 246 215 234 230 234 250 C 234 280 249 300 249 318 L 249 328 C 249 333 245 337 240 337 L 195 337 C 190 337 186 333 186 328 L 186 324 C 186 319 190 315 195 315 Z" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Central Pupil / Singularity Dot -->
  <circle cx="256" cy="250" r="10" fill="#ef4444" />
  <circle cx="256" cy="250" r="4" fill="#ffffff" />

  <!-- Android Exclusive Terminal Label -->
  <text x="256" y="380" font-family="monospace" font-size="16" font-weight="900" fill="#ef4444" letter-spacing="4" text-anchor="middle">ANDROID HADAL ED.</text>
  <text x="256" y="405" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2" text-anchor="middle">OFFLINE AIR-GAPPED</text>
</svg>
