    <script>
      // Cleanly intercept and suppress any Vite development WebSocket / send connection errors in dev proxy
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (typeof e.reason.message === 'string') && (e.reason.message.includes("reading 'send'") || e.reason.message.includes('WebSocket') || e.reason.message.includes('vite'))) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function(e) {
        if (e && e.message && (typeof e.message === 'string') && (e.message.includes("reading 'send'") || e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
  </head>
